[package]
name = "tinykeeper"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
# In the future, we may want to migrate from postcard to rkyv for true zero-copy deserialization!
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
threadpool = "1.8"
toml = "1.1"
